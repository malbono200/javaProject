<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>회원가입 폼</title>
</head>
<body>
<h3 style="text-align: center;">회원 가입</h3>
    <hr>
    <form action="insertMember" method="post">
        성명 <input type="text" name="name"><br>
        ID <input type="text" name="id"><br>
        비밀번호 <input type="password" name="pwd"><br>
        휴대폰 번호 
        <input type="text" name="phone1" size="3"> - 
        <input type="text" name="phone2" size="4"> - 
        <input type="text" name="phone3" size="4"><br>
        학년 
        <input type="radio" name="grade" value="1학년">1학년 
        <input type="radio" name="grade" value="2학년">2학년 
        <input type="radio" name="grade" value="3학년">3학년 
        <input type="radio" name="grade" value="4학년">4학년<br>
        관심분야 
        <input type="checkbox" id="web" name="interest" value="웹 프로그래밍">웹 프로그래밍 
        <input type="checkbox" id="design" name="interest" value="파이썬">파이썬 
        <input type="checkbox" id="bigdata" name="interest" value="빅데이터">빅데이터 
        <input type="checkbox" id="java" name="interest" value="자바">자바 프로그래밍<br>
        학과 
        <select name="major">
            <option value="">선택하세요</option>
            <option value="컴퓨터공학과">컴퓨터공학과</option>
            <option value="소프트웨어공학과">소프트웨어공학과</option>
            <option value="경영학과">경영학과</option>
        </select><br>
        <button type="submit">완료</button>
        <button type="reset">취소</button>
    </form>
</body>
</html>
